# Render Blueprint Configuration
# This file makes deployment to Render.com simple and automated

services:
  # Web Service - Next.js Application
  - type: web
    name: b2b-ecommerce
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: b2b-ecommerce-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  # PostgreSQL Database
  - name: b2b-ecommerce-db
    databaseName: b2b_db_ehde
    plan: free
    region: oregon

